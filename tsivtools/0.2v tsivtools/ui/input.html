<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="input.css">
</head>
<body>
    <div id="overlay" class="hidden">
        <div id="box">
            <div id="title">Enter a value</div>
            <input id="field" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
            <div id="row">
                <span id="hint">Enter to confirm &middot; Escape to cancel</span>
                <span id="counter"></span>
            </div>
        </div>
    </div>
    <script src="input.js"></script>
</body>
</html>
