<!DOCTYPE html>
<html style="width: 100%;height: 100%;">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Anti Cheat</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>

<body style="background: transparent;width: 100%;height: 100%;color: rgba(39,33,41,0.81);visibility: hidden;">
    <div style="width: 100%;height: 15%;background: transparent;margin-top: 0%;padding-top: 0%;border-bottom-style: solid;border-bottom-color: var(--blue);">
        <h1 class="d-inline-block" style="height: 100%;text-align: center;font-size: 71px;color: var(--danger);border-bottom-style: none;user-select: none;margin-bottom: 0px;padding-left: 37%;">Anti Cheat</h1>
        <div class="dropdown d-inline float-right" style="padding: 0%;padding-bottom: 0%;margin-right: 3%;width: 10%;padding-top: 3%;">
            <button id = "selectdropwdown" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-expanded="false" type="button" style="width: 100%;background: transparent;color: var(--danger);border-style: none;border-color: var(--danger);user-select: none; font-weight: bold;">Columns</button>
            <div id = "dropmenushow" class="dropdown-menu" style="width: auto;background: transparent;border-color: var(--danger);font-size: 0.7em;text-align: center;font-weight: bold;">
               
                
            </div>
        </div>
        <input type="search" class="float-right" id="searchbox" style="padding-right: 0%;padding-top: 0%;margin: 0.0%;background: transparent;color: var(--danger);border: 1px solid var(--danger);border-radius: 3px;margin-top: 3.3%;margin-right: 1%;" onkeypress="search()" />
    </div>
    <div style="width: 100%;height: 85%;background: transparent;font-size: 16px;">
        <div class="table-responsive bounce animated" style="height: 100%;">
            <table class="table table-hover">
                <thead style="border: 0px none transparent ;">
                    <tr id="tablecolumns" style="height: 20%;border-style: none;border-bottom-style: none;border-bottom-color: transparent;"></tr>
                </thead>
                <tbody class="text-left" id="tablerows" style="height: 60%;border: 0px none transparent ;"></tbody>
            </table>
        </div>
    </div>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/main.js"></script>
